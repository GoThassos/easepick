# Build the documentation site (docs/, VitePress) and publish it to GitHub Pages:
# https://gothassos.github.io/easepick/
#
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Docs

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; skip queued ones in between.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # full history for the "Last updated" dates
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
    - run: npm ci
    # The live demos use the packages built from this repository.
    - run: npm run prod
    - run: npm run docs:build
    # Coverage badge for the README, served at /coverage.json. The threshold is
    # off here so a drop shows on the badge instead of blocking the docs
    # deploy; the Node.js CI workflow still enforces it.
    - run: npx jest --coverage --coverageReporters=json-summary --coverageThreshold='{}'
    - run: node scripts/coverage-badge.js coverage/coverage-summary.json docs/.vitepress/dist/coverage.json
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
