# Clean install, build and test on every supported Node.js LTS line.
# Release schedule: https://nodejs.org/en/about/previous-releases

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm run prod
    # Type checking resolves the packages through their built dist/*.d.ts, so it has to run after the build.
    - run: npm run typecheck
    - run: npm run test:coverage
